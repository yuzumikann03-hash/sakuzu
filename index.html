<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>算数・数学 作図スタジオ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #f8fafc; color: #334155; }
  header { height: 50px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; flex-shrink: 0; z-index: 10; }
  .title-group { display: flex; flex-direction: column; }
  .title { font-size: 15px; font-weight: bold; color: #4f46e5; }
  .subtitle { font-size: 10px; color: #64748b; }
  .header-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .btn { padding: 5px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: #ffffff; color: #334155; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.15s; }
  .btn:hover { background: #f1f5f9; }
  .btn.active { background: #6366f1; color: white; border-color: #6366f1; }
  .btn-danger { color: #ef4444; border-color: #fca5a5; }
  .btn-danger:hover { background: #fef2f2; }
  .btn-success { background: #10b981; color: white; border-color: #10b981; }
  
  .main-container { flex: 1; display: flex; position: relative; overflow: hidden; }
  .sidebar { width: 140px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 8px 6px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-shrink: 0; z-index: 5; }
  .sidebar-section { font-size: 10px; font-weight: bold; color: #94a3b8; margin-top: 6px; margin-bottom: 2px; padding-left: 4px; text-transform: uppercase; }
  .tool-btn { width: 100%; padding: 8px 6px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; color: #475569; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; text-align: left; transition: all 0.15s; }
  .tool-btn:hover { background: #e2e8f0; }
  .tool-btn.active { background: #e0e7ff; color: #4338ca; border-color: #818cf8; }

  .canvas-wrapper { flex: 1; position: relative; background: #ffffff; overflow: hidden; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 420px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .modal-header { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #1e293b; }
  .modal-body { font-size: 13px; color: #475569; line-height: 1.6; margin-bottom: 16px; }
  .modal-close { float: right; background: #6366f1; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <div class="title-group">
      <div class="title">算数・数学 作図スタジオ</div>
      <div class="subtitle">定規・コンパス・分度器・吸着機能で正確に作図しよう</div>
    </div>
    <div class="header-tools">
      <button class="btn active" id="btnSnap" onclick="toggleSnap()">🧲 吸着(スナップ) <span id="snapStatus">ON</span></button>
      <button class="btn active" id="bg-grid" onclick="setBg('grid')">方眼紙</button>
      <button class="btn" id="bg-fine" onclick="setBg('fine')">細かめ</button>
      <button class="btn" id="bg-dot" onclick="setBg('dot')">ドット</button>
      <button class="btn" id="bg-blank" onclick="setBg('blank')">白紙</button>
      <button class="btn" onclick="undo()">↺</button>
      <button class="btn" onclick="redo()">↻</button>
      <button class="btn btn-danger" onclick="clearCanvas()">🗑</button>
      <button class="btn btn-success" onclick="exportImage()">📥 画像保存</button>
      <button class="btn" onclick="toggleHelp()">❓</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-section">基本操作</div>
      <button class="tool-btn active" id="tool-select" onclick="selectTool('select')">🖐 選択・移動</button>
      <button class="tool-btn" id="tool-line" onclick="selectTool('line')">✏️ 直線</button>
      <button class="tool-btn" id="tool-circle" onclick="selectTool('circle')">⭕ 円/円弧</button>
      <button class="tool-btn" id="tool-eraser" onclick="selectTool('eraser')">🧹 消しゴム</button>
      
      <div class="sidebar-section">作図器具</div>
      <button class="tool-btn" id="inst-ruler" onclick="toggleInstrument('ruler')">📏 定規</button>
      <button class="tool-btn" id="inst-compass" onclick="toggleInstrument('compass')">📐 コンパス</button>
      <button class="tool-btn" id="inst-protractor" onclick="toggleInstrument('protractor')">⏱ 分度器</button>
      <button class="tool-btn" id="inst-tri45" onclick="toggleInstrument('tri45')">📐 直角二等辺</button>
      <button class="tool-btn" id="inst-tri30" onclick="toggleInstrument('tri30')">📐 30°-60°定規</button>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="mainCanvas"></canvas>
    </div>
  </div>

  <div class="modal" id="helpModal">
    <div class="modal-content">
      <div class="modal-header">使い方ガイド</div>
      <div class="modal-body">
        ・<b>直線 / 円</b>：キャンバス上をドラッグして作成します。<br>
        ・<b>スナップ機能</b>：格子点（交点）に自動で吸着します。<br>
        ・<b>器具（定規・コンパス等）</b>：ボタンを押すとキャンバス上に表示されます。中心や角度を調整して作図の目安に利用できます。
      </div>
      <button class="modal-close" onclick="toggleHelp()">閉じる</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    let currentTool = 'line';
    let isSnap = true;
    let currentBg = 'grid';

    let shapes = [];
    let undoStack = [];
    let redoStack = [];

    // 作図器具の状態
    let instruments = {
      ruler: { show: false, x: 150, y: 150, angle: 0, width: 320, height: 60 },
      compass: { show: false, x: 250, y: 250, radius: 80, angle: 0 },
      protractor: { show: false, x: 300, y: 200, angle: 0, radius: 100 },
      tri45: { show: false, x: 180, y: 220, angle: 0, size: 180 },
      tri30: { show: false, x: 280, y: 220, angle: 0, size: 200 }
    };

    let isDrawing = false;
    let startPoint = { x: 0, y: 0 };
    let currentPoint = { x: 0, y: 0 };

    function resizeCanvas() {
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    function snap(x, y) {
      if (!isSnap) return { x, y };
      const gridSize = currentBg === 'fine' ? 15 : 30;
      return {
        x: Math.round(x / gridSize) * gridSize,
        y: Math.round(y / gridSize) * gridSize
      };
    }

    function toggleSnap() {
      isSnap = !isSnap;
      document.getElementById('snapStatus').innerText = isSnap ? 'ON' : 'OFF';
      document.getElementById('btnSnap').classList.toggle('active', isSnap);
    }

    function setBg(bg) {
      currentBg = bg;
      ['grid', 'fine', 'dot', 'blank'].forEach(b => {
        const btn = document.getElementById('bg-' + b);
        if (btn) btn.classList.toggle('active', b === bg);
      });
      redraw();
    }

    function selectTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.sidebar .tool-btn').forEach(btn => {
        if (btn.id.startsWith('tool-')) btn.classList.remove('active');
      });
      const target = document.getElementById('tool-' + tool);
      if (target) target.classList.add('active');
    }

    function toggleInstrument(instKey) {
      instruments[instKey].show = !instruments[instKey].show;
      const btn = document.getElementById('inst-' + instKey);
      if (btn) btn.classList.toggle('active', instruments[instKey].show);
      redraw();
    }

    function saveState() {
      undoStack.push(JSON.stringify(shapes));
      redoStack = [];
    }

    function undo() {
      if (undoStack.length > 0) {
        redoStack.push(JSON.stringify(shapes));
        shapes = JSON.parse(undoStack.pop());
        redraw();
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        undoStack.push(JSON.stringify(shapes));
        shapes = JSON.parse(redoStack.pop());
        redraw();
      }
    }

    function clearCanvas() {
      if (confirm('画面をクリアしますか？')) {
        saveState();
        shapes = [];
        redraw();
      }
    }

    function exportImage() {
      const link = document.createElement('a');
      link.download = '作図ノート.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function toggleHelp() {
      const modal = document.getElementById('helpModal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    // 描画処理
    function drawBackground() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentBg === 'blank') return;

      const step = currentBg === 'fine' ? 15 : 30;
      ctx.lineWidth = 0.5;

      if (currentBg === 'dot') {
        ctx.fillStyle = '#cbd5e1';
        for (let x = 0; x < canvas.width; x += step) {
          for (let y = 0; y < canvas.height; y += step) {
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else {
        ctx.strokeStyle = currentBg === 'fine' ? '#e2e8f0' : '#cbd5e1';
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += step) {
          ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        for (let y = 0; y < canvas.height; y += step) {
          ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
      }
    }

    function drawShapes() {
      shapes.forEach(s => {
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (s.type === 'line') {
          ctx.moveTo(s.x1, s.y1);
          ctx.lineTo(s.x2, s.y2);
        } else if (s.type === 'circle') {
          ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
        }
        ctx.stroke();
      });
    }

    function drawInstruments() {
      // 定規
      if (instruments.ruler.show) {
        const r = instruments.ruler;
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.angle);
        ctx.fillStyle = 'rgba(224, 231, 255, 0.7)';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 1.5;
        ctx.fillRect(0, 0, r.width, r.height);
        ctx.strokeRect(0, 0, r.width, r.height);

        ctx.fillStyle = '#334155';
        for (let i = 0; i <= r.width; i += 10) {
          const h = (i % 50 === 0) ? 20 : ((i % 10 === 0) ? 12 : 6);
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, h);
          ctx.stroke();
          if (i % 50 === 0 && i > 0) {
            ctx.font = '10px sans-serif';
            ctx.fillText(i / 10, i - 4, h + 12);
          }
        }
        ctx.restore();
      }

      // コンパス
      if (instruments.compass.show) {
        const c = instruments.compass;
        ctx.save();
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ec4899';
        ctx.fill();

        const px = c.x + c.radius * Math.cos(c.angle);
        const py = c.y + c.radius * Math.sin(c.angle);
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(px, py);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 分度器
      if (instruments.protractor.show) {
        const p = instruments.protractor;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = 'rgba(254, 243, 199, 0.6)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 1.5;
        
        ctx.beginPath();
        ctx.arc(0, 0, p.radius, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        for (let a = 0; a <= 180; a += 10) {
          const rad = (a - 180) * Math.PI / 180;
          const len = (a % 30 === 0) ? 15 : 8;
          const x1 = (p.radius - len) * Math.cos(rad);
          const y1 = (p.radius - len) * Math.sin(rad);
          const x2 = p.radius * Math.cos(rad);
          const y2 = p.radius * Math.sin(rad);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 直角二等辺三角定規
      if (instruments.tri45.show) {
        const t = instruments.tri45;
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.angle);
        ctx.fillStyle = 'rgba(207, 250, 254, 0.6)';
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(t.size, 0);
        ctx.lineTo(0, t.size);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // 30°-60°三角定規
      if (instruments.tri30.show) {
        const t = instruments.tri30;
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.angle);
        ctx.fillStyle = 'rgba(220, 252, 231, 0.6)';
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(t.size, 0);
        ctx.lineTo(0, t.size * Math.tan(Math.PI / 6));
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function redraw() {
      drawBackground();
      drawShapes();
      drawInstruments();

      if (isDrawing) {
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (currentTool === 'line') {
          ctx.moveTo(startPoint.x, startPoint.y);
          ctx.lineTo(currentPoint.x, currentPoint.y);
        } else if (currentTool === 'circle') {
          const r = Math.hypot(currentPoint.x - startPoint.x, currentPoint.y - startPoint.y);
          ctx.arc(startPoint.x, startPoint.y, r, 0, Math.PI * 2);
        }
        ctx.stroke();
      }
    }

    // イベント処理
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const rawX = e.clientX - rect.left;
      const rawY = e.clientY - rect.top;
      const pt = snap(rawX, rawY);

      if (currentTool === 'eraser') {
        shapes = shapes.filter(s => {
          if (s.type === 'line') {
            const d = Math.hypot(rawX - (s.x1 + s.x2)/2, rawY - (s.y1 + s.y2)/2);
            return d > 20;
          } else if (s.type === 'circle') {
            const d = Math.hypot(rawX - s.cx, rawY - s.cy);
            return Math.abs(d - s.r) > 15;
          }
          return true;
        });
        redraw();
        return;
      }

      isDrawing = true;
      startPoint = pt;
      currentPoint = pt;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const rawX = e.clientX - rect.left;
      const rawY = e.clientY - rect.top;
      currentPoint = snap(rawX, rawY);
      redraw();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;

      if (currentTool === 'line') {
        if (startPoint.x !== currentPoint.x || startPoint.y !== currentPoint.y) {
          saveState();
          shapes.push({ type: 'line', x1: startPoint.x, y1: startPoint.y, x2: currentPoint.x, y2: currentPoint.y });
        }
      } else if (currentTool === 'circle') {
        const r = Math.hypot(currentPoint.x - startPoint.x, currentPoint.y - startPoint.y);
        if (r > 5) {
          saveState();
          shapes.push({ type: 'circle', cx: startPoint.x, cy: startPoint.y, r: r });
        }
      }
      redraw();
    });

    // 初期化
    resizeCanvas();
  </script>
</body>
</html>
